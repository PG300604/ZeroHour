services:
  - type: web
    name: zerohour-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: zerohour-a84d3
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: FRONTEND_URL
        value: https://zerohour-a84d3.web.app
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://zerohour-a84d3.web.app,https://zerohour-a84d3.firebaseapp.com
      - key: SPRING_PROFILES_ACTIVE
        value: prod
